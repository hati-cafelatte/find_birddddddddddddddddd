<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a9d5d">
<title>とりさがし</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f4f8ef;--card:#fff;--ink:#1d2b22;--accent:#2e7d4f;--sub:#556;--line:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#142018;--card:#1e2f24;--ink:#f0f6f1;--accent:#3f9d63;--sub:#b5c2b8;--line:#52c07a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.9}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
h1{font-size:1.2rem;margin:0}
button{font:inherit;border:0;border-radius:999px;min-height:48px;padding:6px 20px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
#map{height:40vh;min-height:220px}
#bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px}
#bar button{font-size:1.1rem}
#list{display:grid;gap:12px;padding:0 12px 24px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px #0002}
.card img{width:100%;height:240px;object-fit:contain;background:#8883;display:block}
.body{padding:10px 14px 14px}
.name{font-size:1.3rem;font-weight:700}
p{margin:4px 0 8px}
.msg{text-align:center;color:var(--sub)}
rt{font-size:.55em}
/* スプラッシュ */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:16px;background:linear-gradient(160deg,#52c07a,#1f6b42);color:#fff;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#icon{width:112px;height:112px;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:64px;box-shadow:0 10px 30px #0004;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#splash b{font-size:1.6rem;letter-spacing:.2em;animation:up .8s .3s both}
#splash i{width:120px;height:4px;border-radius:2px;background:#fff4;overflow:hidden;animation:up .8s .5s both}
#splash i::after{content:"";display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:fill 1.5s .3s both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes up{from{transform:translateY(12px);opacity:0}}
@keyframes fill{from{transform:scaleX(0)}}
/* カメラ */
#cam{position:fixed;inset:0;z-index:5000;background:#000;overflow:hidden}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#1b2a22}
#scope{position:absolute;inset:0;width:100%;height:100%}
/* スマホ縦持ち時もカメラ画面を横向きの全画面レイアウトにする */
@media (orientation:portrait) and (max-width:900px){
  #cam{width:100dvh;height:100vw;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
}
#hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;color:#fff;text-shadow:0 1px 4px #000}
#shutter{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);width:84px;height:84px;padding:0;border-radius:50%;background:#fff;border:6px solid #ffffffaa;background-clip:padding-box}
#shutter:active{transform:translateX(-50%) scale(.92)}
#cx{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);background:#0008}
#rs{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);min-height:32px;padding:0 8px;font-size:10px;background:transparent;color:#fff;opacity:.3}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .35s}
@keyframes fl{from{opacity:.9}to{opacity:0}}
#scan{position:absolute;inset:0;background:#000a;display:grid;place-content:center;justify-items:center;gap:14px;color:#fff;font-size:1.2rem}
#scan s{width:56px;height:56px;border:6px solid #fff4;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#res{position:absolute;inset:0;background:#000b;overflow:auto;padding:16px}
.sheet{max-width:520px;margin:0 auto;background:var(--bg);border-radius:20px;padding:14px}
.sheet h2{margin:0 0 8px;text-align:center;color:var(--accent);font-size:1.5rem}
.sheet button.ghost{display:block;margin:12px auto 0}
.rar{font-weight:700;color:#a35a00}
@media (prefers-color-scheme:dark){.rar{color:#ffc04d}}
#mw{position:relative}
#tp{position:absolute;top:6px;right:6px;z-index:1000;min-height:26px;padding:0 8px;font-size:.7rem;line-height:1.4;background:#fffc;color:#1d2b22;border:1px solid var(--accent);opacity:.8}
#pet{position:fixed;inset:0;z-index:7000;background:var(--bg);overflow:auto;padding:12px 14px 28px}
.pw{max-width:520px;margin:0 auto}
#pet h2{text-align:center;margin:4px 0}
#stage{position:relative;height:300px;display:flex;align-items:flex-end;justify-content:center;background:var(--card);border-radius:20px;overflow:hidden;touch-action:none;user-select:none;cursor:pointer;box-shadow:0 1px 4px #0002}
#sp{display:block;margin-bottom:10px;pointer-events:none}
.ht{position:absolute;color:#e0456b;font-size:28px;pointer-events:none;animation:ht 1s forwards}
@keyframes ht{to{transform:translateY(-70px);opacity:0}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:sh .4s}
#mt{text-align:center;font-size:1.3rem;margin-top:6px}
#mt b{color:#e0456b;letter-spacing:.1em}
#pm{min-height:3.6em}
#foods{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" role="img" aria-label="とりさがし"><div id="icon">🐦</div><b>とりさがし</b><i></i></div>

<header>
  <h1 class="t" data-t="とりをさがそう（？）">とりをさがそう（？）</h1>
  <button id="fb" class="ghost"></button>
</header>
<div id="mw"><div id="map"></div><button id="tp"></button></div>
<div id="bar">
  <button id="go"></button>
  <button id="camb"></button>
  <button id="zk" class="ghost"></button>
</div>
<div id="list" aria-live="polite"></div>

<div id="cam" hidden>
  <video id="vid" playsinline muted autoplay></video>
  <svg id="scope" viewBox="0 0 200 100" preserveAspectRatio="xMidYMid meet" style="overflow:visible" aria-hidden="true">
    <defs><mask id="m" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="6200" height="6100">
      <rect x="-3000" y="-3000" width="6200" height="6100" fill="#fff"/>
      <circle cx="58" cy="50" r="46" fill="#000"/><circle cx="142" cy="50" r="46" fill="#000"/>
    </mask></defs>
    <rect x="-3000" y="-3000" width="6200" height="6100" fill="#000" fill-opacity=".93" mask="url(#m)"/>
    <circle cx="58" cy="50" r="46" fill="none" stroke="#333" stroke-width="3"/><circle cx="142" cy="50" r="46" fill="none" stroke="#333" stroke-width="3"/>
    <path d="M52 50h-8M64 50h8M58 44v-8M58 56v8M136 50h-8M148 50h8M142 44v-8M142 56v8" stroke="#fff8" stroke-width=".8"/>
  </svg>
  <div id="hint" class="t" data-t="鳥{とり}を まるの中{なか}に入{い}れて シャッター"></div>
  <button id="cx" aria-label="とじる"></button>
  <button id="shutter" aria-label="しゃしん をとる"></button>
  <button id="rs" aria-label="リセット">リセット</button>
  <div id="flash"></div>
  <div id="scan" hidden><s></s><span class="t" data-t="しらべています…"></span></div>
  <div id="res" hidden><div class="sheet"><h2 class="t" data-t="図鑑{ずかん}とうろく！"></h2><div id="rc"></div><button id="rb" class="ghost"></button></div></div>
</div>

<div id="pet" hidden role="dialog" aria-label="かわいがる"><div class="pw">
  <button id="pc" class="ghost"></button>
  <h2 class="t" data-t="ルリビタキ">ルリビタキ</h2>
  <div id="stage"><img id="sp" alt="ルリビタキ"></div>
  <div id="mt"></div>
  <p id="pm" class="msg" aria-live="polite"></p>
  <button id="nadeb" style="display:block;margin:0 auto 10px"></button>
  <p class="msg t" data-t="ごはんを あげよう（ルリビタキは 虫{むし}や クモ、冬{ふゆ}は 木{き}の実{み}も 食{た}べるよ）"></p>
  <div id="foods"></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// 漢字{よみ} 形式 → ふりがなON/OFFで切り替え
const RE=/([一-龥々]+)\{([^}]*)\}/g;
let furi=localStorage.getItem('furi')!=='0';
const R=s=>furi?s.replace(RE,'<ruby>$1<rt>$2</rt></ruby>'):s.replace(RE,'$1');
const T=s=>`<span class="t" data-t="${s}">${R(s)}</span>`;
const $=id=>document.getElementById(id);
function refresh(){
  document.querySelectorAll('.t').forEach(e=>e.innerHTML=R(e.dataset.t));
  fb.textContent=furi?'ふりがな ON':'ふりがな OFF';
  go.innerHTML=R('鳥{とり}をさがす');
  camb.innerHTML='カメラ';
  zk.innerHTML=R('図鑑{ずかん}');
  tp.innerHTML=inHok?R('もどる'):R('北{きた}へ');
  rb.innerHTML=R('もどる');
  pc.innerHTML=R('とじる');
  nadeb.innerHTML='なでる';
  cx.innerHTML=R('とじる');
}

// 鳥データ(時期と生息域はざっくり)  m:[開始月,終了月] lat:最低緯度
const BIRDS=[
{n:'スズメ',w:'Passer montanus',m:[1,12],d:'まちでいちばん見{み}かける小{ちい}さな鳥{とり}。チュンチュンと鳴{な}く。'},
{n:'ハシブトガラス',w:'Corvus macrorhynchos',m:[1,12],d:'大{おお}きくて黒{くろ}い鳥{とり}。とても頭{あたま}がいい。'},
{n:'ヒヨドリ',w:'Hypsipetes amaurotis',m:[1,12],d:'ヒーヨ、ヒーヨと大{おお}きな声{こえ}で鳴{な}く。花{はな}のみつも好{す}き。'},
{n:'メジロ',w:'Zosterops japonicus',m:[1,12],d:'緑{みどり}色{いろ}で目{め}のまわりが白{しろ}い。梅{うめ}や桜{さくら}の花{はな}に来{く}る。'},
{n:'シジュウカラ',w:'Parus minor',m:[1,12],d:'ネクタイのような黒{くろ}い線{せん}がある。ツーピー、ツーピーと鳴{な}く。'},
{n:'ハクセキレイ',w:'Motacilla alba',m:[1,12],d:'尾{お}をふりながら地面{じめん}を歩{ある}く白黒{しろくろ}の鳥{とり}。'},
{n:'カルガモ',w:'Anas zonorhyncha',m:[1,12],d:'池{いけ}や川{かわ}にすむカモ。春{はる}には、ひなを連{つ}れて歩{ある}く。'},
{n:'カワセミ',w:'Alcedo atthis',m:[1,12],d:'青{あお}く光{ひか}る「川{かわ}の宝石{ほうせき}」。水{みず}にとびこんで魚{さかな}をとる。'},
{n:'ムクドリ',w:'Spodiopsar cineraceus',m:[1,12],d:'夕方{ゆうがた}に大{おお}きなむれで木{き}にあつまる。'},
{n:'ツバメ',w:'Hirundo rustica',m:[4,9],d:'春{はる}に南{みなみ}の国{くに}から来{き}て、家{いえ}ののきに巣{す}をつくる。'},
{n:'ウグイス',w:'Horornis diphone',m:[3,7],d:'ホーホケキョと鳴{な}く春{はる}のしらせ。すがたは見{み}つけにくい。'},
{n:'ホトトギス',w:'Cuculus poliocephalus',m:[5,8],d:'夏{なつ}に来{く}る渡{わた}り鳥{どり}。「テッペンカケタカ」と鳴{な}く。'},
{n:'ヒバリ',w:'Alauda arvensis',m:[3,8],d:'畑{はたけ}や草原{そうげん}で、空高{そらたか}くとびながらさえずる。'},
{n:'ジョウビタキ',w:'Phoenicurus auroreus',m:[10,4],d:'秋{あき}に日本{にほん}に来{き}て冬{ふゆ}をすごす。オレンジ色{いろ}のおなか。'},
{n:'ツグミ',w:'Turdus naumanni',m:[11,4],d:'冬{ふゆ}にやって来{く}る。地面{じめん}をぴょんぴょんはねて虫{むし}をさがす。'},
{n:'コガモ',w:'Anas crecca',m:[10,3],d:'日本{にほん}でいちばん小{ちい}さなカモ。冬{ふゆ}の池{いけ}や川{かわ}にいる。'},
{n:'オオハクチョウ',w:'Cygnus cygnus',m:[11,3],lat:37,d:'シベリアから冬{ふゆ}に来{く}る大{おお}きな白{しろ}い鳥{とり}。'}
];
// カメラ用(1回目・2回目の順に出る)
const CAM=[
{n:'ルリビタキ',w:'Tarsiger cyanurus',pet:true,d:'青{あお}いからだがきれいな小{ちい}さな鳥{とり}。冬{ふゆ}は町{まち}の公園{こうえん}にも来{く}る。「幸{しあわ}せの青{あお}い鳥{とり}」と呼{よ}ばれる。'},
{n:'シマエナガ',w:'Aegithalos caudatus',lat:41.5,d:'北海道{ほっかいどう}にすむ、まっ白{しろ}でまるい鳥{とり}。「雪{ゆき}の妖精{ようせい}」と呼{よ}ばれて人気{にんき}。'}
];
// ルリビタキ(どこでも)・シマエナガ(北海道だけ)も「鳥をさがす」に出す
BIRDS.push(...CAM.map(b=>({...b,m:[1,12]})));
// レア度(1〜5)。都内を基本に、北海道だけ一部変更
const RAR={'スズメ':[1],'ハシブトガラス':[1],'ヒヨドリ':[1],'ハクセキレイ':[1],'シジュウカラ':[1],
'ムクドリ':[2],'メジロ':[2],
'ジョウビタキ':[3],'コガモ':[3],
'ツグミ':[4],'カワセミ':[4],'ルリビタキ':[5],
'カルガモ':[1],'ツバメ':[1],'ウグイス':[2],'ヒバリ':[2],'ホトトギス':[3],'オオハクチョウ':[3,4],'シマエナガ':[2,4]};
const RN=['ふつう','すこしレア','レア','スーパーレア','ゲキレア'];
const region=()=>pos[0]>=41.5?'hok':'tokyo';
// 地域ごとの鳥リスト(11月下旬)  名前:[レア度,ひとこと]
const REG={
tokyo:{'スズメ':[1,'よく見{み}られる'],'ハシブトガラス':[1,'よく見{み}られる'],'ヒヨドリ':[1,'よく見{み}られる'],'メジロ':[2,'よく見{み}られる'],
'ジョウビタキ':[3,'冬鳥{ふゆどり}として飛来{ひらい}'],'ハクセキレイ':[1,'よく見{み}られる'],'カルガモ':[1,'よく見{み}られる'],'カワセミ':[4,'水辺{みずべ}で観察{かんさつ}できる'],
'ムクドリ':[2,'よく見{み}られる'],'ツグミ':[4,'冬鳥{ふゆどり}として飛来{ひらい}'],'コガモ':[3,'冬鳥{ふゆどり}として飛来{ひらい}'],'ルリビタキ':[5,'林{はやし}や公園{こうえん}で探{さが}したい鳥{とり}']},
hok:{'スズメ':[1,'よく見{み}られる'],'ハシブトガラス':[1,'よく見{み}られる'],'ヒヨドリ':[1,'よく見{み}られる'],'メジロ':[2,'冬{ふゆ}には少{すく}なくなる'],
'ジョウビタキ':[3,'北海道{ほっかいどう}では迷鳥{めいちょう}に近{ちか}い'],'ハクセキレイ':[1,'地域{ちいき}によって見{み}られる'],'カルガモ':[1,'水辺{みずべ}で観察{かんさつ}できる'],'カワセミ':[4,'生息地{せいそくち}が限{かぎ}られる'],
'ムクドリ':[2,'地域差{ちいきさ}がある'],'オオハクチョウ':[4,'北海道{ほっかいどう}で見{み}られる'],'ツグミ':[4,'秋{あき}に渡来{とらい}する'],'コガモ':[3,'冬鳥{ふゆどり}として飛来{ひらい}'],'シマエナガ':[4,'北海道{ほっかいどう}で見{み}られる']}};
// カメラで撮ったとき、1回目・2回目…に出る鳥
const SEQ={tokyo:['ルリビタキ','カワセミ'],hok:['シマエナガ']};
const rar=b=>(REG[region()][b.n]||RAR[b.n]||[2])[0];
const rarText=b=>{const r=rar(b),e=REG[region()][b.n];return '★'.repeat(r)+'☆'.repeat(5-r)+' '+(e?e[1]:RN[r-1]);};
const inSeason=(b,mo)=>b.m[0]<=b.m[1]?mo>=b.m[0]&&mo<=b.m[1]:(mo>=b.m[0]||mo<=b.m[1]);

// 地図
let pos=[35.681,139.767],realPos=pos,inHok=false,quiet=false;
const map=L.map('map').setView(pos,14);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
const me=L.circleMarker(pos,{radius:9,color:'#fff',weight:3,fillColor:'#2a7fff',fillOpacity:1}).addTo(map);
navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{
  realPos=[p.coords.latitude,p.coords.longitude];if(!inHok){pos=realPos;me.setLatLng(pos);map.setView(pos,15);}
},()=>{},{enableHighAccuracy:true,timeout:8000});

// Wikipedia から画像、Commons から鳴き声
const imgCache={};
async function getImg(b){
  if(imgCache[b.n]!==undefined)return imgCache[b.n];
  try{
    const j=await (await fetch('https://ja.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(b.n))).json();
    return imgCache[b.n]=(j.thumbnail&&j.thumbnail.source)||'';
  }catch(e){return imgCache[b.n]='';}
}
async function getSound(b){
  if(b.snd!==undefined)return b.snd;
  try{
    const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|mime&format=json&origin=*&gsrsearch='+encodeURIComponent('filetype:audio '+b.w);
    const j=await (await fetch(u)).json();
    const hit=Object.values((j.query||{}).pages||{}).map(p=>p.imageinfo&&p.imageinfo[0]).find(i=>i&&/^(audio|application\/ogg)/.test(i.mime));
    return b.snd=hit?hit.url:'';
  }catch(e){return b.snd='';}
}
let playing=null;
async function toggleSound(b,btn){
  const label=R('鳴{な}き声{ごえ}をきく');
  if(playing){playing.a.pause();playing.btn.innerHTML=label;const same=playing.btn===btn;playing=null;if(same)return;}
  btn.textContent='…';
  const url=await getSound(b);
  if(!url){btn.innerHTML=R('音{おと}が見{み}つからなかった');return;}
  const a=new Audio(url);
  a.onended=()=>{btn.innerHTML=label;playing=null;};
  a.onerror=()=>{btn.innerHTML=R('再生{さいせい}できない');playing=null;};
  try{await a.play();playing={a,btn};btn.innerHTML=R('とめる');}catch(e){btn.innerHTML=R('再生{さいせい}できない');}
}

// 鳥カード
function makeCard(b){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<img alt="${b.n}" loading="lazy"><div class="body"><div class="name">${T(b.n)}</div><div class="rar">${T('レア度{ど} '+rarText(b))}</div><p>${T(b.d)}</p><button></button></div>`;
  const btn=c.querySelector('button');btn.innerHTML=R('鳴{な}き声{ごえ}をきく');
  btn.onclick=()=>toggleSound(b,btn);
  getImg(b).then(src=>{const im=c.querySelector('img');if(src)im.src=src;else im.style.display='none';});
  return c;
}
const box=$('list');
function show(head,cards){
  box.innerHTML='';
  const h=document.createElement('p');h.className='msg';h.innerHTML=T(head);box.append(h,...cards);
  if(!quiet)box.scrollIntoView({behavior:'smooth'});
}
go.onclick=()=>{
  const mo=new Date().getMonth()+1;
  show(`今{いま}の時期{じき}、この近{ちか}くで見{み}られる鳥{とり}（${mo}月{がつ}）`,
    Object.keys(REG[region()]).map(n=>BIRDS.find(b=>b.n===n)).filter(b=>b&&inSeason(b,mo)).map(makeCard));
};

// 北海道へワープ(札幌)
tp.onclick=()=>{
  inHok=!inHok;pos=inHok?[43.0618,141.3545]:realPos;
  me.setLatLng(pos);map.setView(pos,inHok?12:15);
  refresh();quiet=true;go.onclick();quiet=false;
};

function setSp(k){cur=k;sp.src=SPR[k].d;sp.style.width=(SPR[k].w*pk)+'px';}
function sizeStage(){
  const v=Object.values(SPR),mh=Math.max(...v.map(x=>x.h)),mw=Math.max(...v.map(x=>x.w));
  pk=Math.min((stage.clientHeight-20)/mh,stage.clientWidth*.95/mw);
}
function upd(){const n=Math.min(5,Math.floor(love/20));mt.innerHTML=T('なかよし度{ど}')+' <b>'+'♥'.repeat(n)+'♡'.repeat(5-n)+'</b> '+n+'/5';}
function flip(k,ms){setSp(k);clearTimeout(sprT);sprT=setTimeout(()=>setSp('n'),ms);}
function nade(x,y){
  const t=Date.now();if(t-lastN<250)return;lastN=t;
  love=Math.min(100,love+2);upd();flip('h',1000);
  const r=stage.getBoundingClientRect(),h=document.createElement('span');
  h.className='ht';h.textContent='♥';h.setAttribute('aria-hidden','true');
  h.style.left=(x-r.left-14)+'px';h.style.top=(y-r.top-14)+'px';stage.append(h);setTimeout(()=>h.remove(),1000);
  say(love>=100?'なかよしに なったよ！':'うれしそう！ きもちよさそう。');
}
stage.onpointerdown=e=>nade(e.clientX,e.clientY);
stage.onpointermove=e=>nade(e.clientX,e.clientY);
nadeb.onclick=()=>{const r=stage.getBoundingClientRect();nade(r.left+r.width/2,r.top+r.height*.35);};
function feed(f){
  if(f.ok){love=Math.min(100,love+12);upd();flip('e',2000);say(f.m);}
  else{stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');say(f.m);}
}
FOODS.forEach(f=>{const b=document.createElement('button');b.className='ghost';b.innerHTML=T(f.t);b.onclick=()=>feed(f);foods.append(b);});
function petOpen(){pet.hidden=false;sizeStage();setSp('n');upd();say('なでたり ごはんを あげたり してね');}
pc.onclick=()=>{pet.hidden=true;};
const regCard=b=>{
  const c=makeCard(b);
  if(b.pet){const k=document.createElement('button');k.textContent='かわいがる';k.style.marginTop='8px';k.onclick=petOpen;c.querySelector('.body').append(k);}
  return c;
};

// カメラ
let shots=0,stream=null,busy=false;
camb.onclick=async()=>{
  cam.hidden=false;
  try{
    // 対応ブラウザでは横向き固定を試す。失敗してもCSSで横向き表示する。
    if(screen.orientation&&screen.orientation.lock){
      try{await screen.orientation.lock('landscape');}catch(e){}
    }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error('HTTPS_REQUIRED');
    }
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    vid.srcObject=stream;
    await vid.play();
  }catch(e){
    console.error('Camera error:',e);
    if(e.message==='HTTPS_REQUIRED')hint.textContent='HTTPSで開いてください（GitHub Pagesで公開できます）';
    else if(e.name==='NotAllowedError')hint.textContent='カメラの使用を許可してください';
    else if(e.name==='NotFoundError')hint.textContent='カメラが見つかりません';
    else hint.textContent='カメラを起動できません: '+(e.name||'エラー');
  }
};
function closeCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;vid.srcObject=null;}
  if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();
  cam.hidden=true;scan.hidden=true;res.hidden=true;busy=false;
  hint.innerHTML=R(hint.dataset.t);
}
cx.onclick=closeCam;
shutter.onclick=()=>{
  if(busy)return;busy=true;
  flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');
  vid.pause&&vid.pause();
  scan.hidden=false;
  setTimeout(()=>{
    const el=SEQ[region()].map(n=>BIRDS.find(x=>x.n===n));const b=el[shots%el.length];shots++;
    if(!dex.some(x=>x.n===b.n))dex.push(b);
    scan.hidden=true;
    rc.innerHTML='';rc.append(regCard(b));
    res.hidden=false;
  },1800);
};
rb.onclick=()=>{res.hidden=true;busy=false;vid.play&&vid.play().catch(()=>{});};
rs.onclick=()=>{shots=0;dex=[];love=0;hint.textContent='リセットしました';setTimeout(()=>hint.innerHTML=R(hint.dataset.t),1500);};

fb.onclick=()=>{furi=!furi;localStorage.setItem('furi',furi?'1':'0');refresh();};
refresh();
// スプラッシュ
const spl=$('splash');const endSplash=()=>{spl.classList.add('out');setTimeout(()=>spl.remove(),700);};
setTimeout(endSplash,2000);spl.onclick=endSplash;
</script>
